# Runs the contract, front end and keeper tests on every pull request and on
# every push to main. The mainnet fork tests skip themselves without
# ARC_FORK_URL, so CI needs no RPC endpoint and no secret.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            keeper/package-lock.json
      # The app's tests import keeper code, so the keeper's dependencies must
      # be installed for them to type-check.
      - run: npm ci
        working-directory: keeper
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      # Type-checks the app and its tests, then runs vitest.
      - run: npm test
        working-directory: app

  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
