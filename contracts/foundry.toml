[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# The Paid event carries every statement field, which exceeds the legacy
# pipeline's stack limit; the IR pipeline compiles it.
via_ir = true

# Arc mainnet (chain id 5042). The URL comes from the environment so that
# keyed RPC endpoints never land in the repository.
[rpc_endpoints]
arc = "${ARC_RPC_URL}"
base = "${BASE_RPC_URL}"
