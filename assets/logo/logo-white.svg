    <circle cx="41" cy="42" r="2" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="84" y="48.5" font-family="Geist, Inter, system-ui, sans-serif" font-weight="600" font-size="36" letter-spacing="-0.72" fill="#FFFFFF">Ardoise</text>
</svg>
